name: Build Duo Launcher

on:
  push:
    paths:
      - "duolauncher/**"
      - ".github/workflows/duolauncher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duolauncher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key
        run: base64 -d debug.keystore.b64 > debug.keystore

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DuoLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DuoLauncher-apk
          path: duolauncher/DuoLauncher.apk

      # A release per build, so the APK is one tap to download on a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: duolauncher-build-${{ github.run_number }}
          name: Duo Launcher build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Download DuoLauncher.apk below and open it to install.
          files: duolauncher/DuoLauncher.apk
